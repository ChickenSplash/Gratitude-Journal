<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gratitude Journal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/styles.css">
</head>

<body>
<div id="root"></div>

<!-- Production React builds. Babel is here only so the JSX in journal-app.jsx
     runs without a build step — see "Dropping Babel" in the README. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<!-- No JSX in here, so it loads as an ordinary script and defines `Journal`
     before Babel gets to work on the file below. -->
<script src="/journal-core.js"></script>

<script type="text/babel" data-presets="react" src="/journal-app.jsx"></script>
</body>
</html>
