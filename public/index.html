<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gratitude Journal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
  /* ── Theme tokens ─────────────────────────────────────────────── */
  :root {
    --bg:            #FFF8F5;
    --card:          #FFFFFF;
    --text:          #2D2520;
    --text-muted:    #6B5B52;
    --border:        #F4DDD1;
    --accent:        #FF8C61;
    --accent-hover:  #FF7647;
    --accent-soft:   rgba(255, 140, 97, 0.09);
    --input-bg:      #FFFBF8;
    --shadow:        rgba(255, 140, 97, 0.08);
    --danger:        #C4442E;

    --font-body:     'DM Sans', system-ui, sans-serif;
    --font-display:  'Lora', Georgia, serif;
    --radius:        12px;
    --radius-lg:     16px;
  }

  [data-theme="dark"] {
    --bg:            #1A1614;
    --card:          #241F1C;
    --text:          #F5EDE7;
    --text-muted:    #B8A99E;
    --border:        #3D3430;
    --accent:        #FF8C61;
    --accent-hover:  #FFA47F;
    --accent-soft:   rgba(255, 140, 97, 0.13);
    --input-bg:      #2D2722;
    --shadow:        rgba(0, 0, 0, 0.32);
    --danger:        #FF8B75;
  }

  /* ── Base ─────────────────────────────────────────────────────── */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── Layout ───────────────────────────────────────────────────── */
  .shell {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-bottom: 8px;
  }

  .topbar .who {
    margin-right: auto;
    font-size: 14px;
    color: var(--text-muted);
  }

  .topbar .who strong { color: var(--text); font-weight: 600; }

  .masthead { text-align: center; margin-bottom: 44px; }

  .masthead h1 {
    margin: 0 0 8px;
    font-size: clamp(32px, 5vw, 42px);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .masthead p {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--text-muted);
  }

  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: clamp(24px, 5vw, 40px);
    box-shadow: 0 2px 16px var(--shadow);
    transition: background-color 0.3s ease;
  }

  .card + .card { margin-top: 20px; }

  /* ── Form ─────────────────────────────────────────────────────── */
  .field + .field { margin-top: 24px; }

  .field label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .field textarea,
  .field input {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    color: var(--text);
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    transition: border-color 0.2s ease, background-color 0.3s ease;
  }

  .field textarea { min-height: 80px; resize: vertical; }

  .field textarea:focus,
  .field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .field textarea::placeholder,
  .field input::placeholder { color: var(--text-muted); opacity: 0.7; }

  .hint {
    margin: 20px 0 0;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }

  kbd {
    font: inherit;
    font-size: 12px;
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--input-bg);
  }

  /* ── Buttons ──────────────────────────────────────────────────── */
  .btn {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
  }

  .btn-primary {
    display: block;
    width: 100%;
    margin-top: 28px;
    padding: 16px;
    color: #fff;
    background: var(--accent);
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-quiet {
    padding: 8px 14px;
    font-weight: 500;
    font-size: 15px;
    color: var(--accent);
    background: transparent;
    border-radius: 8px;
  }
  .btn-quiet:hover { background: var(--accent-soft); }

  .btn-icon {
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border-radius: 8px;
  }
  .btn-icon:hover { background: var(--accent-soft); color: var(--text); }

  .btn-danger { color: var(--danger); }

  /* ── Auth ─────────────────────────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    padding: 4px;
    background: var(--input-bg);
    border-radius: 10px;
  }

  .tabs button {
    flex: 1;
    padding: 10px;
    font: inherit;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .tabs button[aria-selected="true"] {
    color: var(--text);
    background: var(--card);
    box-shadow: 0 1px 4px var(--shadow);
  }

  .form-error {
    margin: 20px 0 0;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--danger);
    background: var(--input-bg);
    border: 1px solid var(--danger);
    border-radius: 10px;
  }

  .auth-note {
    margin: 20px 0 0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-muted);
    text-align: center;
  }

  /* ── Toast ────────────────────────────────────────────────────── */
  .toast {
    margin-bottom: 24px;
    padding: 16px;
    text-align: center;
    font-weight: 500;
    color: var(--accent);
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    animation: rise 0.3s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── History ──────────────────────────────────────────────────── */
  .history-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 28px;
  }

  .history h2 {
    margin: 32px 0 20px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .entry {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 8px var(--shadow);
    transition: background-color 0.3s ease;
  }

  .entry header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .entry time {
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
  }

  .entry ol {
    margin: 0;
    padding-left: 20px;
    color: var(--text);
  }

  .entry li + li { margin-top: 10px; }

  .entry li::marker { color: var(--text-muted); font-size: 14px; }

  .confirm { display: flex; gap: 2px; align-items: center; }
  .confirm span { font-size: 13px; color: var(--text-muted); margin-right: 4px; }

  .empty {
    margin-top: 28px;
    text-align: center;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--text-muted);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>

<body>
<div id="root"></div>

<!-- Production React builds. Babel is here only so the JSX below runs without a
     build step — see the note at the bottom of this file for removing it. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ─── API ──────────────────────────────────────────────────────────
   The session lives in an HttpOnly cookie, so there is no token for
   this code to hold — the browser attaches it and JS can't read it. */
async function request(method, path, body) {
  const res = await fetch(path, {
    method,
    credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

const api = {
  me:       ()            => request('GET',    '/api/auth/me'),
  login:    creds         => request('POST',   '/api/auth/login', creds),
  register: creds         => request('POST',   '/api/auth/register', creds),
  logout:   ()            => request('POST',   '/api/auth/logout'),
  list:     ()            => request('GET',    '/api/entries'),
  create:   entry         => request('POST',   '/api/entries', entry),
  bulk:     entries       => request('POST',   '/api/entries/bulk', { entries }),
  remove:   id            => request('DELETE', `/api/entries/${encodeURIComponent(id)}`),
};

/* ─── Local storage ────────────────────────────────────────────────
   Only the theme is written here now; journal entries live in SQLite
   for signed-in users and in memory for guests.                      */
const THEME_KEY = 'gratitudeTheme';
const LEGACY_ENTRIES_KEY = 'gratitudeEntries';

const local = {
  get(key) {
    try { return window.localStorage.getItem(key); } catch { return null; }
  },
  set(key, value) {
    try { window.localStorage.setItem(key, value); } catch { /* ignore */ }
  },
  remove(key) {
    try { window.localStorage.removeItem(key); } catch { /* ignore */ }
  },
};

const SLOTS = 3;

/* ─── Helpers ──────────────────────────────────────────────────── */
const newId = () =>
  window.crypto?.randomUUID?.() ??
  `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;

/** Migrates and validates parsed JSON from an imported file.
 *  Anything malformed is dropped rather than allowed to crash the render. */
function sanitiseEntries(parsed) {
  if (!Array.isArray(parsed)) return [];

  return parsed
    .filter(e => e && typeof e === 'object' && Array.isArray(e.items))
    .map(e => ({
      id: String(e.id ?? newId()),
      date: typeof e.date === 'string' ? e.date : new Date().toISOString(),
      items: e.items.filter(i => typeof i === 'string' && i.trim() !== ''),
    }))
    .filter(e => e.items.length > 0);
}

const byNewest = (a, b) => new Date(b.date) - new Date(a.date);

/** Entries written by the pre-server version of this app, which kept
 *  everything in localStorage. They are read back into guest state so an
 *  upgrade doesn't look like the journal has been wiped, and the key is only
 *  cleared once the entries are safely in an account. */
function loadLegacyEntries() {
  const raw = local.get(LEGACY_ENTRIES_KEY);
  if (!raw) return [];

  try {
    return sanitiseEntries(JSON.parse(raw)).sort(byNewest);
  } catch {
    return [];
  }
}

const dateFormatter = new Intl.DateTimeFormat('en-GB', {
  day: 'numeric', month: 'short', year: 'numeric',
});
const sameDayFormatter = new Intl.DateTimeFormat('en-GB', {
  day: 'numeric', month: 'short',
});

function formatDate(isoString) {
  const date = new Date(isoString);
  if (Number.isNaN(date.getTime())) return 'Unknown date';

  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);

  if (date.toDateString() === today.toDateString()) return 'Today';
  if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';

  return date.getFullYear() === today.getFullYear()
    ? sameDayFormatter.format(date)
    : dateFormatter.format(date);
}

/* ─── Theme ────────────────────────────────────────────────────── */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    const stored = local.get(THEME_KEY);
    if (stored === 'light' || stored === 'dark') return stored;
    return window.matchMedia?.('(prefers-color-scheme: dark)').matches
      ? 'dark'
      : 'light';
  });

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    local.set(THEME_KEY, theme);
  }, [theme]);

  const toggle = useCallback(
    () => setTheme(t => (t === 'dark' ? 'light' : 'dark')),
    []
  );

  return [theme, toggle];
}

/* ─── Entry card ───────────────────────────────────────────────── */
function EntryCard({ entry, onDelete }) {
  const [confirming, setConfirming] = useState(false);
  const label = formatDate(entry.date);

  return (
    <article className="entry">
      <header>
        <time dateTime={entry.date}>{label}</time>

        {confirming ? (
          <div className="confirm">
            <span>Delete this entry?</span>
            <button
              type="button"
              className="btn btn-icon btn-danger"
              onClick={() => onDelete(entry.id)}
            >
              Delete
            </button>
            <button
              type="button"
              className="btn btn-icon"
              onClick={() => setConfirming(false)}
            >
              Keep
            </button>
          </div>
        ) : (
          <button
            type="button"
            className="btn btn-icon"
            onClick={() => setConfirming(true)}
          >
            Delete<span className="sr-only"> entry from {label}</span>
          </button>
        )}
      </header>

      <ol>
        {entry.items.map((item, i) => (
          <li key={i}>{item}</li>
        ))}
      </ol>
    </article>
  );
}

/* ─── Auth panel ───────────────────────────────────────────────── */
function AuthPanel({ mode, setMode, onSubmit, onCancel, pendingCount }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const registering = mode === 'register';

  const submit = async event => {
    event.preventDefault();
    setError('');
    setBusy(true);

    try {
      await onSubmit(mode, { username, password });
    } catch (err) {
      setError(err.message);
      setBusy(false);
    }
  };

  return (
    <section className="card" aria-label="Account">
      <div className="tabs" role="tablist">
        <button
          type="button"
          role="tab"
          aria-selected={!registering}
          onClick={() => { setMode('login'); setError(''); }}
        >
          Sign in
        </button>
        <button
          type="button"
          role="tab"
          aria-selected={registering}
          onClick={() => { setMode('register'); setError(''); }}
        >
          Create account
        </button>
      </div>

      <form onSubmit={submit}>
        <div className="field">
          <label htmlFor="username">Username</label>
          <input
            id="username"
            name="username"
            autoComplete="username"
            value={username}
            onChange={e => setUsername(e.target.value)}
            placeholder="grateful.human"
            required
          />
        </div>

        <div className="field">
          <label htmlFor="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autoComplete={registering ? 'new-password' : 'current-password'}
            value={password}
            onChange={e => setPassword(e.target.value)}
            placeholder={registering ? 'At least 8 characters' : ''}
            required
          />
        </div>

        {error && <p className="form-error" role="alert">{error}</p>}

        <button type="submit" className="btn btn-primary" disabled={busy}>
          {busy ? 'One moment…' : registering ? 'Create account' : 'Sign in'}
        </button>
      </form>

      <p className="auth-note">
        {pendingCount > 0 && (
          <>
            Your {pendingCount} unsaved {pendingCount === 1 ? 'entry' : 'entries'} will
            move into your account.<br />
          </>
        )}
        <button type="button" className="btn btn-quiet" onClick={onCancel}>
          Carry on as a guest
        </button>
      </p>
    </section>
  );
}

/* ─── App ──────────────────────────────────────────────────────── */
function GratitudeJournal() {
  const [theme, toggleTheme] = useTheme();

  const [user, setUser] = useState(undefined); // undefined = still checking
  const [authMode, setAuthMode] = useState(null); // null | 'login' | 'register'

  const [drafts, setDrafts] = useState(() => Array(SLOTS).fill(''));
  const [entries, setEntries] = useState([]);
  const [showHistory, setShowHistory] = useState(false);
  const [toast, setToast] = useState('');
  const [carriedOver, setCarriedOver] = useState(0); // entries from the old version

  const toastTimer = useRef(null);
  const firstField = useRef(null);
  const fileInput = useRef(null);

  const signedIn = Boolean(user);

  const flash = useCallback(message => {
    setToast(message);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2500);
  }, []);

  useEffect(() => () => clearTimeout(toastTimer.current), []);

  /** Drops back to guest state, seeded with anything the old version left. */
  const resetToGuest = useCallback(() => {
    const legacy = loadLegacyEntries();
    setEntries(legacy);
    setCarriedOver(legacy.length);
  }, []);

  /* Who am I? Runs once; the cookie decides. Guests start from whatever the
     old localStorage-only version left behind. */
  useEffect(() => {
    let live = true;

    (async () => {
      try {
        const { user } = await api.me();
        if (!live) return;
        setUser(user);

        if (!user) return resetToGuest();

        const { entries: mine } = await api.list();
        if (live) setEntries(mine);
      } catch {
        if (!live) return;
        setUser(null); // server unreachable — degrade to guest mode
        resetToGuest();
      }
    })();

    return () => { live = false; };
  }, [resetToGuest]);

  const filled = useMemo(
    () => drafts.map(d => d.trim()).filter(Boolean),
    [drafts]
  );

  const updateDraft = (index, value) =>
    setDrafts(prev => prev.map((d, i) => (i === index ? value : d)));

  /* ─── Auth actions ─────────────────────────────────────────────
     On sign-in, anything written as a guest is handed to the server
     so nothing typed before logging in is thrown away.             */
  const authenticate = async (mode, credentials) => {
    const { user } = mode === 'register'
      ? await api.register(credentials)
      : await api.login(credentials);

    const guestEntries = entries;
    let adopted = 0;
    let mine;

    /* The session already exists at this point, so a failed hand-off must not
       leave the UI pretending we're still a guest — fall back to the account's
       own entries and say what happened. */
    try {
      if (guestEntries.length > 0) {
        ({ added: adopted, entries: mine } = await api.bulk(guestEntries));
      } else {
        ({ entries: mine } = await api.list());
      }
    } catch {
      mine = [];
    }

    if (adopted > 0) {
      local.remove(LEGACY_ENTRIES_KEY); // safely in an account now
      setCarriedOver(0);
    }

    setUser(user);
    setEntries(mine);
    setAuthMode(null);
    flash(
      adopted > 0
        ? `Signed in — ${adopted} ${adopted === 1 ? 'entry' : 'entries'} saved to your account.`
        : `Signed in as ${user.username}.`
    );
  };

  const signOut = async () => {
    try { await api.logout(); } catch { /* the cookie is gone either way */ }
    setUser(null);
    resetToGuest();
    setShowHistory(false);
    flash('Signed out.');
  };

  /* ─── Entry actions ────────────────────────────────────────────
     One branch per storage backend: the server for members, plain
     React state for guests.                                        */
  const save = async () => {
    if (filled.length === 0) return;

    const entry = { id: newId(), date: new Date().toISOString(), items: filled };

    if (signedIn) {
      try {
        const saved = await api.create(entry);
        setEntries(prev => [saved.entry, ...prev]);
      } catch (err) {
        flash(err.message);
        return;
      }
    } else {
      setEntries(prev => [entry, ...prev]);
    }

    setDrafts(Array(SLOTS).fill(''));
    flash(signedIn ? 'Entry saved.' : 'Saved for this visit only.');
    firstField.current?.focus();
  };

  const deleteEntry = async id => {
    if (signedIn) {
      try {
        await api.remove(id);
      } catch (err) {
        flash(err.message);
        return;
      }
    }
    setEntries(prev => prev.filter(e => e.id !== id));
  };

  /* Ctrl/Cmd+Enter from any textarea saves. */
  const onKeyDown = event => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
      event.preventDefault();
      save();
    }
  };

  const exportEntries = () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], {
      type: 'application/json',
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `gratitude-journal-${new Date()
      .toISOString()
      .slice(0, 10)}.json`;
    link.click();
    URL.revokeObjectURL(url);
  };

  /* Adds entries from an exported file, skipping ones already here. */
  const importEntries = async event => {
    const file = event.target.files?.[0];
    event.target.value = ''; // so the same file can be picked again
    if (!file) return;

    let imported;
    try {
      imported = sanitiseEntries(JSON.parse(await file.text()));
    } catch {
      flash("Couldn't read that file — is it a journal export?");
      return;
    }

    if (signedIn) {
      try {
        const { added, entries: fresh } = await api.bulk(imported);
        setEntries(fresh);
        flash(
          added === 0
            ? 'Nothing new in that file.'
            : `Imported ${added} ${added === 1 ? 'entry' : 'entries'}.`
        );
      } catch (err) {
        flash(err.message);
      }
      return;
    }

    const seen = new Set(entries.map(e => e.id));
    const fresh = imported.filter(e => !seen.has(e.id));

    if (fresh.length === 0) {
      flash(
        imported.length === 0
          ? 'No entries found in that file.'
          : 'Those entries are already in your journal.'
      );
      return;
    }

    setEntries(prev => [...prev, ...fresh].sort(byNewest));
    flash(`Imported ${fresh.length} ${fresh.length === 1 ? 'entry' : 'entries'}.`);
  };

  /* Nothing renders until the session check settles, so the header
     can't flicker from "Sign in" to a username. */
  if (user === undefined) {
    return (
      <div className="shell">
        <p className="empty">Opening your journal…</p>
      </div>
    );
  }

  return (
    <div className="shell">
      <div className="topbar">
        <span className="who">
          {signedIn
            ? <>Signed in as <strong>{user.username}</strong></>
            : 'Guest'}
        </span>

        {signedIn ? (
          <button type="button" className="btn btn-icon" onClick={signOut}>
            Sign out
          </button>
        ) : (
          <button
            type="button"
            className="btn btn-icon"
            onClick={() => setAuthMode(m => (m ? null : 'login'))}
            aria-expanded={authMode !== null}
          >
            Sign in
          </button>
        )}

        <button
          type="button"
          className="btn btn-icon"
          onClick={toggleTheme}
          aria-pressed={theme === 'dark'}
        >
          {theme === 'dark' ? '☀ Light' : '☾ Dark'}
        </button>
      </div>

      <header className="masthead">
        <h1>Gratitude Journal</h1>
        <p>What are you grateful for today?</p>
      </header>

      {/* Announced to screen readers without stealing focus. */}
      <div role="status" aria-live="polite">
        {toast && <div className="toast">{toast}</div>}
      </div>

      {authMode && !signedIn && (
        <AuthPanel
          mode={authMode}
          setMode={setAuthMode}
          onSubmit={authenticate}
          onCancel={() => setAuthMode(null)}
          pendingCount={entries.length}
        />
      )}

      <section className="card" aria-label="New entry">
        {drafts.map((value, index) => (
          <div className="field" key={index}>
            <label htmlFor={`gratitude-${index}`}>{index + 1}.</label>
            <textarea
              id={`gratitude-${index}`}
              ref={index === 0 ? firstField : null}
              value={value}
              onChange={e => updateDraft(index, e.target.value)}
              onKeyDown={onKeyDown}
              placeholder="I'm grateful for..."
            />
          </div>
        ))}

        <button
          type="button"
          className="btn btn-primary"
          onClick={save}
          disabled={filled.length === 0}
        >
          Save entry
        </button>

        <p className="hint">
          <kbd>Ctrl</kbd> + <kbd>Enter</kbd> saves
        </p>
      </section>

      {entries.length === 0 && (
        <p className="empty">Your first entry will appear here.</p>
      )}

      <div className="history-bar">
        {entries.length > 0 && (
          <>
            <button
              type="button"
              className="btn btn-quiet"
              onClick={() => setShowHistory(v => !v)}
              aria-expanded={showHistory}
              aria-controls="history"
            >
              {showHistory ? 'Hide past entries' : 'View past entries'} (
              {entries.length})
            </button>
            <button type="button" className="btn btn-icon" onClick={exportEntries}>
              Export
            </button>
          </>
        )}

        <button
          type="button"
          className="btn btn-icon"
          onClick={() => fileInput.current?.click()}
        >
          Import
        </button>
        <input
          type="file"
          accept="application/json,.json"
          ref={fileInput}
          onChange={importEntries}
          className="sr-only"
          aria-label="Import entries from a JSON file"
        />
      </div>

      {entries.length > 0 && showHistory && (
        <section className="history" id="history">
          <h2>Past entries</h2>
          {entries.map(entry => (
            <EntryCard key={entry.id} entry={entry} onDelete={deleteEntry} />
          ))}
        </section>
      )}

      {!signedIn && (
        <p className="empty">
          {carriedOver > 0
            ? `${carriedOver} ${carriedOver === 1 ? 'entry' : 'entries'} from the
               earlier version of this app are still on this device. New ones
               vanish when you close the tab. `
            : "You're writing as a guest, so entries vanish when you close this tab. "}
          <button
            type="button"
            className="btn btn-quiet"
            onClick={() => setAuthMode('register')}
          >
            Create an account
          </button>{' '}
          to keep them.
        </p>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GratitudeJournal />);
</script>
</body>
</html>
