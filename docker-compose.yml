services:
  journal:
    build: .
    container_name: gratitude-journal
    restart: unless-stopped
    ports:
      - "3000:3000"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/data
    environment:
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    networks:
      - edge

networks:
  edge:
    external: true