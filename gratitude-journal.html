<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gratitude Journal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
  /* ── Theme tokens ─────────────────────────────────────────────── */
  :root {
    --bg:            #FFF8F5;
    --card:          #FFFFFF;
    --text:          #2D2520;
    --text-muted:    #6B5B52;
    --border:        #F4DDD1;
    --accent:        #FF8C61;
    --accent-hover:  #FF7647;
    --accent-soft:   rgba(255, 140, 97, 0.09);
    --input-bg:      #FFFBF8;
    --shadow:        rgba(255, 140, 97, 0.08);
    --danger:        #C4442E;

    --font-body:     'DM Sans', system-ui, sans-serif;
    --font-display:  'Lora', Georgia, serif;
    --radius:        12px;
    --radius-lg:     16px;
  }

  [data-theme="dark"] {
    --bg:            #1A1614;
    --card:          #241F1C;
    --text:          #F5EDE7;
    --text-muted:    #B8A99E;
    --border:        #3D3430;
    --accent:        #FF8C61;
    --accent-hover:  #FFA47F;
    --accent-soft:   rgba(255, 140, 97, 0.13);
    --input-bg:      #2D2722;
    --shadow:        rgba(0, 0, 0, 0.32);
    --danger:        #FF8B75;
  }

  /* ── Base ─────────────────────────────────────────────────────── */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── Layout ───────────────────────────────────────────────────── */
  .shell {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-bottom: 8px;
  }

  .topbar .who {
    margin-right: auto;
    font-size: 13px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .masthead { text-align: center; margin-bottom: 44px; }

  .masthead h1 {
    margin: 0 0 8px;
    font-size: clamp(32px, 5vw, 42px);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .masthead p {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--text-muted);
  }

  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: clamp(24px, 5vw, 40px);
    box-shadow: 0 2px 16px var(--shadow);
    transition: background-color 0.3s ease;
  }

  /* ── Form ─────────────────────────────────────────────────────── */
  .field + .field { margin-top: 24px; }

  .field label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .field textarea,
  .field input {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    color: var(--text);
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    transition: border-color 0.2s ease, background-color 0.3s ease;
  }

  .field textarea { min-height: 80px; resize: vertical; }

  .field textarea:focus,
  .field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .field textarea::placeholder,
  .field input::placeholder { color: var(--text-muted); opacity: 0.7; }

  .hint {
    margin: 20px 0 0;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }

  kbd {
    font: inherit;
    font-size: 12px;
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--input-bg);
  }

  /* ── Buttons ──────────────────────────────────────────────────── */
  .btn {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
  }

  .btn-primary {
    display: block;
    width: 100%;
    margin-top: 28px;
    padding: 16px;
    color: #fff;
    background: var(--accent);
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-secondary {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    color: var(--accent);
    background: transparent;
    border: 2px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--accent-soft); }
  .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-quiet {
    padding: 8px 14px;
    font-weight: 500;
    font-size: 15px;
    color: var(--accent);
    background: transparent;
    border-radius: 8px;
  }
  .btn-quiet:hover { background: var(--accent-soft); }

  .btn-icon {
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border-radius: 8px;
  }
  .btn-icon:hover { background: var(--accent-soft); color: var(--text); }

  .btn-danger { color: var(--danger); }

  /* ── Toast ────────────────────────────────────────────────────── */
  .toast {
    margin-bottom: 24px;
    padding: 16px;
    text-align: center;
    font-weight: 500;
    color: var(--accent);
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    animation: rise 0.3s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Banner ───────────────────────────────────────────────────── */
  .banner {
    margin-bottom: 20px;
    padding: 16px 20px;
    font-size: 14px;
    color: var(--text-muted);
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
  }

  .banner p { margin: 0 0 12px; }
  .banner p:last-child { margin-bottom: 0; }

  .banner-actions { display: flex; gap: 4px; flex-wrap: wrap; }

  /* ── Auth ─────────────────────────────────────────────────────── */
  .auth { max-width: 420px; margin: 0 auto; }

  .switcher {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .switcher button[aria-selected="true"] {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .error {
    margin: 20px 0 0;
    font-size: 14px;
    color: var(--danger);
    text-align: center;
  }

  /* ── History ──────────────────────────────────────────────────── */
  .history-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 28px;
  }

  .history h2 {
    margin: 32px 0 20px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .entry {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 8px var(--shadow);
    transition: background-color 0.3s ease;
  }

  .entry header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .entry time {
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
  }

  .entry ol {
    margin: 0;
    padding-left: 20px;
    color: var(--text);
  }

  .entry li + li { margin-top: 10px; }

  .entry li::marker { color: var(--text-muted); font-size: 14px; }

  .confirm { display: flex; gap: 2px; align-items: center; }
  .confirm span { font-size: 13px; color: var(--text-muted); margin-right: 4px; }

  .empty {
    margin-top: 28px;
    text-align: center;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--text-muted);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>

<body>
<div id="root"></div>

<!-- Production React builds. Babel is here only so the JSX below runs without a
     build step — see the note at the bottom of this file for removing it. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ─── Supabase ─────────────────────────────────────────────────────
   Paste your project's URL and anon (publishable) key here — both are
   safe to ship in a public page: the anon key only grants what Row
   Level Security allows, and the policies in supabase/schema.sql
   restrict every row to the user who created it.

   Leave them blank and the app runs exactly as before, storing
   everything in this browser only.  See SETUP.md.                    */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

const cloud =
  SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

/* ─── Storage ──────────────────────────────────────────────────────
   localStorage can throw: disabled cookies, private browsing, quota.
   Falling back to memory keeps the app usable for the session rather
   than crashing on mount.                                            */
const storage = (() => {
  let backing = null;
  try {
    const probe = '__probe__';
    window.localStorage.setItem(probe, probe);
    window.localStorage.removeItem(probe);
    backing = window.localStorage;
  } catch {
    backing = null;
  }

  const memory = new Map();

  return {
    persistent: backing !== null,
    get(key) {
      try {
        return backing ? backing.getItem(key) : memory.get(key) ?? null;
      } catch {
        return null;
      }
    },
    set(key, value) {
      try {
        if (backing) backing.setItem(key, value);
        else memory.set(key, value);
        return true;
      } catch {
        return false;
      }
    },
    remove(key) {
      try {
        if (backing) backing.removeItem(key);
        else memory.delete(key);
      } catch {
        /* nothing useful to do */
      }
    },
  };
})();

const ENTRIES_KEY = 'gratitudeEntries';
const THEME_KEY = 'gratitudeTheme';
const uploadedKey = userId => `gratitudeUploaded:${userId}`;
const SLOTS = 3;

/* ─── Helpers ──────────────────────────────────────────────────── */
const newId = () =>
  window.crypto?.randomUUID?.() ??
  `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;

/** Migrates and validates parsed JSON — from storage or an imported file.
 *  Anything malformed is dropped rather than allowed to crash the render. */
function sanitiseEntries(parsed) {
  if (!Array.isArray(parsed)) return [];

  return parsed
    .filter(e => e && typeof e === 'object' && Array.isArray(e.items))
    .map(e => ({
      id: String(e.id ?? newId()),
      date: typeof e.date === 'string' ? e.date : new Date().toISOString(),
      items: e.items.filter(i => typeof i === 'string' && i.trim() !== ''),
    }))
    .filter(e => e.items.length > 0);
}

const byNewest = (a, b) => new Date(b.date) - new Date(a.date);

function loadLocalEntries() {
  const raw = storage.get(ENTRIES_KEY);
  if (!raw) return [];

  try {
    return sanitiseEntries(JSON.parse(raw));
  } catch {
    return [];
  }
}

/* The table stores ids as uuid, so anything imported from an older
   export that predates crypto.randomUUID needs a fresh one. */
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const withUuid = entry => (UUID.test(entry.id) ? entry : { ...entry, id: newId() });

const toRow = (entry, userId) => ({
  id: entry.id,
  user_id: userId,
  entry_date: entry.date,
  items: entry.items,
});

const fromRow = row => ({
  id: row.id,
  date: row.entry_date,
  items: Array.isArray(row.items) ? row.items : [],
});

const dateFormatter = new Intl.DateTimeFormat('en-GB', {
  day: 'numeric', month: 'short', year: 'numeric',
});
const sameDayFormatter = new Intl.DateTimeFormat('en-GB', {
  day: 'numeric', month: 'short',
});

function formatDate(isoString) {
  const date = new Date(isoString);
  if (Number.isNaN(date.getTime())) return 'Unknown date';

  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);

  if (date.toDateString() === today.toDateString()) return 'Today';
  if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';

  return date.getFullYear() === today.getFullYear()
    ? sameDayFormatter.format(date)
    : dateFormatter.format(date);
}

/* ─── Theme ────────────────────────────────────────────────────── */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    const stored = storage.get(THEME_KEY);
    if (stored === 'light' || stored === 'dark') return stored;
    return window.matchMedia?.('(prefers-color-scheme: dark)').matches
      ? 'dark'
      : 'light';
  });

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    storage.set(THEME_KEY, theme);
  }, [theme]);

  const toggle = useCallback(
    () => setTheme(t => (t === 'dark' ? 'light' : 'dark')),
    []
  );

  return [theme, toggle];
}

/* ─── Session ──────────────────────────────────────────────────────
   `undefined` while Supabase restores a stored session, so the app can
   avoid flashing the sign-in screen at someone who is already signed in. */
function useSession() {
  const [session, setSession] = useState(cloud ? undefined : null);

  useEffect(() => {
    if (!cloud) return;

    let live = true;
    cloud.auth.getSession().then(({ data }) => {
      if (live) setSession(data.session ?? null);
    });

    const { data } = cloud.auth.onAuthStateChange((_event, next) =>
      setSession(next ?? null)
    );

    return () => {
      live = false;
      data.subscription.unsubscribe();
    };
  }, []);

  return session;
}

/* ─── Data access ──────────────────────────────────────────────────
   One shape, two backings, so the journal below never branches on
   where an entry actually lives.                                     */
function makeRepo(userId) {
  if (!userId) {
    return {
      remote: false,
      async list() {
        return loadLocalEntries();
      },
      async add() {},
      async remove() {},
      async addMany() {},
    };
  }

  return {
    remote: true,
    async list() {
      const { data, error } = await cloud
        .from('entries')
        .select('id, entry_date, items')
        .order('entry_date', { ascending: false });
      if (error) throw error;
      return data.map(fromRow);
    },
    async add(entry) {
      const { error } = await cloud.from('entries').insert(toRow(entry, userId));
      if (error) throw error;
    },
    async remove(id) {
      const { error } = await cloud.from('entries').delete().eq('id', id);
      if (error) throw error;
    },
    async addMany(entries) {
      if (entries.length === 0) return;
      const { error } = await cloud
        .from('entries')
        .insert(entries.map(e => toRow(e, userId)));
      if (error) throw error;
    },
  };
}

/* Supabase surfaces these as prose already; this just keeps the rare
   unhelpful ones from reaching the screen. */
const describe = error =>
  error?.message?.trim() || 'Something went wrong. Please try again.';

/* ─── Entry card ───────────────────────────────────────────────── */
function EntryCard({ entry, onDelete }) {
  const [confirming, setConfirming] = useState(false);
  const label = formatDate(entry.date);

  return (
    <article className="entry">
      <header>
        <time dateTime={entry.date}>{label}</time>

        {confirming ? (
          <div className="confirm">
            <span>Delete this entry?</span>
            <button
              type="button"
              className="btn btn-icon btn-danger"
              onClick={() => onDelete(entry.id)}
            >
              Delete
            </button>
            <button
              type="button"
              className="btn btn-icon"
              onClick={() => setConfirming(false)}
            >
              Keep
            </button>
          </div>
        ) : (
          <button
            type="button"
            className="btn btn-icon"
            onClick={() => setConfirming(true)}
          >
            Delete<span className="sr-only"> entry from {label}</span>
          </button>
        )}
      </header>

      <ol>
        {entry.items.map((item, i) => (
          <li key={i}>{item}</li>
        ))}
      </ol>
    </article>
  );
}

/* ─── Sign in ──────────────────────────────────────────────────── */
function AuthScreen({ onGoOffline }) {
  const [mode, setMode] = useState('signin');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [notice, setNotice] = useState('');

  const submit = async event => {
    event.preventDefault();
    setBusy(true);
    setError('');
    setNotice('');

    const credentials = { email: email.trim(), password };
    const { data, error: failure } =
      mode === 'signin'
        ? await cloud.auth.signInWithPassword(credentials)
        : await cloud.auth.signUp(credentials);

    setBusy(false);
    if (failure) {
      setError(describe(failure));
      return;
    }

    /* With email confirmations switched on, signUp returns a user but no
       session — nothing else happens until they click the link. */
    if (mode === 'signup' && !data.session) {
      setNotice('Check your inbox to confirm your email, then sign in.');
      setMode('signin');
      setPassword('');
    }
  };

  const continueAsGuest = async () => {
    setBusy(true);
    setError('');
    const { error: failure } = await cloud.auth.signInAnonymously();
    setBusy(false);
    if (failure) setError(describe(failure));
  };

  return (
    <div className="auth">
      <div className="switcher">
        <button
          type="button"
          className="btn btn-quiet"
          aria-selected={mode === 'signin'}
          onClick={() => { setMode('signin'); setError(''); }}
        >
          Sign in
        </button>
        <button
          type="button"
          className="btn btn-quiet"
          aria-selected={mode === 'signup'}
          onClick={() => { setMode('signup'); setError(''); }}
        >
          Create account
        </button>
      </div>

      <form className="card" onSubmit={submit}>
        <div className="field">
          <label htmlFor="email">Email</label>
          <input
            id="email"
            type="email"
            autoComplete="email"
            required
            value={email}
            onChange={e => setEmail(e.target.value)}
            placeholder="you@example.com"
          />
        </div>

        <div className="field">
          <label htmlFor="password">Password</label>
          <input
            id="password"
            type="password"
            autoComplete={mode === 'signin' ? 'current-password' : 'new-password'}
            required
            minLength={6}
            value={password}
            onChange={e => setPassword(e.target.value)}
            placeholder="At least 6 characters"
          />
        </div>

        <button type="submit" className="btn btn-primary" disabled={busy}>
          {mode === 'signin' ? 'Sign in' : 'Create account'}
        </button>

        {notice && <p className="hint">{notice}</p>}
        {error && <p className="error">{error}</p>}

        <p className="divider">or</p>

        <button
          type="button"
          className="btn btn-secondary"
          onClick={continueAsGuest}
          disabled={busy}
        >
          Continue as a guest
        </button>

        <p className="hint">
          A guest journal is saved to the cloud and stays on this browser. You
          can turn it into a full account later without losing anything.
        </p>

        <button type="button" className="btn btn-secondary" onClick={onGoOffline}>
          Use this device only
        </button>
      </form>
    </div>
  );
}

/* ─── Guest upgrade ────────────────────────────────────────────────
   Attaching an email and password to an anonymous user keeps the same
   auth.uid(), so every existing row stays with them.                 */
function GuestBanner() {
  const [open, setOpen] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [notice, setNotice] = useState('');

  const upgrade = async event => {
    event.preventDefault();
    setBusy(true);
    setError('');

    const { error: failure } = await cloud.auth.updateUser({
      email: email.trim(),
      password,
    });

    setBusy(false);
    if (failure) {
      setError(describe(failure));
      return;
    }

    setNotice(
      'Almost there — click the link in the confirmation email to finish.'
    );
  };

  return (
    <div className="banner">
      <p>
        You're signed in as a guest. Your entries are saved, but you'll lose
        access to them if you clear this browser's data.
      </p>

      {notice ? (
        <p>{notice}</p>
      ) : open ? (
        <form onSubmit={upgrade}>
          <div className="field">
            <label htmlFor="guest-email">Email</label>
            <input
              id="guest-email"
              type="email"
              autoComplete="email"
              required
              value={email}
              onChange={e => setEmail(e.target.value)}
            />
          </div>
          <div className="field">
            <label htmlFor="guest-password">Password</label>
            <input
              id="guest-password"
              type="password"
              autoComplete="new-password"
              required
              minLength={6}
              value={password}
              onChange={e => setPassword(e.target.value)}
            />
          </div>
          <button type="submit" className="btn btn-primary" disabled={busy}>
            Save my account
          </button>
          {error && <p className="error">{error}</p>}
        </form>
      ) : (
        <div className="banner-actions">
          <button
            type="button"
            className="btn btn-quiet"
            onClick={() => setOpen(true)}
          >
            Keep these entries — add an email
          </button>
        </div>
      )}
    </div>
  );
}

/* ─── Journal ──────────────────────────────────────────────────── */
function Journal({ userId }) {
  const repo = useMemo(() => makeRepo(userId), [userId]);

  const [drafts, setDrafts] = useState(() => Array(SLOTS).fill(''));
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [failure, setFailure] = useState('');
  const [showHistory, setShowHistory] = useState(false);
  const [toast, setToast] = useState('');
  const [strays, setStrays] = useState([]);

  const toastTimer = useRef(null);
  const firstField = useRef(null);
  const fileInput = useRef(null);
  const loaded = useRef(false);

  useEffect(() => {
    let live = true;

    repo
      .list()
      .then(rows => {
        if (!live) return;
        setEntries(rows);
        loaded.current = true;
      })
      .catch(error => live && setFailure(describe(error)))
      .finally(() => live && setLoading(false));

    return () => {
      live = false;
      loaded.current = false;
    };
  }, [repo]);

  /* Entries written before signing in are still sitting in this browser.
     Offering the upload beats silently duplicating or discarding them. */
  useEffect(() => {
    if (!repo.remote || storage.get(uploadedKey(userId))) return;
    setStrays(loadLocalEntries());
  }, [repo, userId]);

  /* Local mode keeps its single write path: any change to entries is
     persisted here, so a new mutation can never forget to save. */
  useEffect(() => {
    if (repo.remote || !loaded.current) return;
    const ok = storage.set(ENTRIES_KEY, JSON.stringify(entries));
    if (!ok) setToast("Couldn't save — browser storage is full or blocked.");
  }, [entries, repo]);

  useEffect(() => () => clearTimeout(toastTimer.current), []);

  const flash = useCallback(message => {
    setToast(message);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2500);
  }, []);

  const filled = useMemo(
    () => drafts.map(d => d.trim()).filter(Boolean),
    [drafts]
  );

  const updateDraft = (index, value) =>
    setDrafts(prev => prev.map((d, i) => (i === index ? value : d)));

  const save = async () => {
    if (filled.length === 0) return;

    const entry = { id: newId(), date: new Date().toISOString(), items: filled };

    try {
      await repo.add(entry);
    } catch (error) {
      flash(describe(error));
      return;
    }

    setEntries(prev => [entry, ...prev]);
    setDrafts(Array(SLOTS).fill(''));
    flash('Entry saved.');
    firstField.current?.focus();
  };

  const deleteEntry = async id => {
    try {
      await repo.remove(id);
    } catch (error) {
      flash(describe(error));
      return;
    }
    setEntries(prev => prev.filter(e => e.id !== id));
  };

  /* Ctrl/Cmd+Enter from any textarea saves. */
  const onKeyDown = event => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
      event.preventDefault();
      save();
    }
  };

  const exportEntries = () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], {
      type: 'application/json',
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `gratitude-journal-${new Date()
      .toISOString()
      .slice(0, 10)}.json`;
    link.click();
    URL.revokeObjectURL(url);
  };

  /** Adds entries not already here, then reports how it went. */
  const absorb = async incoming => {
    const seen = new Set(entries.map(e => e.id));
    const fresh = incoming.map(withUuid).filter(e => !seen.has(e.id));

    if (fresh.length === 0) return { added: 0 };

    try {
      await repo.addMany(fresh);
    } catch (error) {
      return { added: 0, error };
    }

    setEntries(prev => [...prev, ...fresh].sort(byNewest));
    return { added: fresh.length };
  };

  const importEntries = async event => {
    const file = event.target.files?.[0];
    event.target.value = ''; // so the same file can be picked again
    if (!file) return;

    let imported;
    try {
      imported = sanitiseEntries(JSON.parse(await file.text()));
    } catch {
      flash("Couldn't read that file — is it a journal export?");
      return;
    }

    const { added, error } = await absorb(imported);
    if (error) return flash(describe(error));

    if (added === 0) {
      flash(
        imported.length === 0
          ? 'No entries found in that file.'
          : 'Those entries are already in your journal.'
      );
      return;
    }

    flash(`Imported ${added} ${added === 1 ? 'entry' : 'entries'}.`);
  };

  const uploadStrays = async () => {
    const { added, error } = await absorb(strays);
    if (error) return flash(describe(error));

    storage.set(uploadedKey(userId), '1');
    storage.remove(ENTRIES_KEY);
    setStrays([]);
    flash(added === 0 ? 'Already up to date.' : `Uploaded ${added}.`);
  };

  const dismissStrays = () => {
    storage.set(uploadedKey(userId), '1');
    setStrays([]);
  };

  if (loading) return <p className="empty">Loading your journal…</p>;

  if (failure) {
    return (
      <div className="card">
        <p className="error">{failure}</p>
        <button
          type="button"
          className="btn btn-secondary"
          onClick={() => window.location.reload()}
        >
          Try again
        </button>
      </div>
    );
  }

  return (
    <>
      {/* Announced to screen readers without stealing focus. */}
      <div role="status" aria-live="polite">
        {toast && <div className="toast">{toast}</div>}
      </div>

      {strays.length > 0 && (
        <div className="banner">
          <p>
            {strays.length} {strays.length === 1 ? 'entry' : 'entries'} saved on
            this device aren't in your account yet.
          </p>
          <div className="banner-actions">
            <button type="button" className="btn btn-quiet" onClick={uploadStrays}>
              Upload {strays.length === 1 ? 'it' : 'them'}
            </button>
            <button type="button" className="btn btn-icon" onClick={dismissStrays}>
              Not now
            </button>
          </div>
        </div>
      )}

      <section className="card" aria-label="New entry">
        {drafts.map((value, index) => (
          <div className="field" key={index}>
            <label htmlFor={`gratitude-${index}`}>{index + 1}.</label>
            <textarea
              id={`gratitude-${index}`}
              ref={index === 0 ? firstField : null}
              value={value}
              onChange={e => updateDraft(index, e.target.value)}
              onKeyDown={onKeyDown}
              placeholder="I'm grateful for..."
            />
          </div>
        ))}

        <button
          type="button"
          className="btn btn-primary"
          onClick={save}
          disabled={filled.length === 0}
        >
          Save entry
        </button>

        <p className="hint">
          <kbd>Ctrl</kbd> + <kbd>Enter</kbd> saves
        </p>
      </section>

      {entries.length === 0 && (
        <p className="empty">Your first entry will appear here.</p>
      )}

      <div className="history-bar">
        {entries.length > 0 && (
          <>
            <button
              type="button"
              className="btn btn-quiet"
              onClick={() => setShowHistory(v => !v)}
              aria-expanded={showHistory}
              aria-controls="history"
            >
              {showHistory ? 'Hide past entries' : 'View past entries'} (
              {entries.length})
            </button>
            <button type="button" className="btn btn-icon" onClick={exportEntries}>
              Export
            </button>
          </>
        )}

        <button
          type="button"
          className="btn btn-icon"
          onClick={() => fileInput.current?.click()}
        >
          Import
        </button>
        <input
          type="file"
          accept="application/json,.json"
          ref={fileInput}
          onChange={importEntries}
          className="sr-only"
          aria-label="Import entries from a JSON file"
        />
      </div>

      {entries.length > 0 && showHistory && (
        <section className="history" id="history">
          <h2>Past entries</h2>
          {entries.map(entry => (
            <EntryCard key={entry.id} entry={entry} onDelete={deleteEntry} />
          ))}
        </section>
      )}

      {!repo.remote && !storage.persistent && (
        <p className="empty">
          Browser storage is unavailable, so entries will only last until you
          close this tab.
        </p>
      )}
    </>
  );
}

/* ─── App ──────────────────────────────────────────────────────── */
function GratitudeJournal() {
  const [theme, toggleTheme] = useTheme();
  const session = useSession();
  const [offline, setOffline] = useState(false);

  const user = offline ? null : session?.user ?? null;
  const guest = user?.is_anonymous === true;

  const signOut = async () => {
    await cloud.auth.signOut();
    setOffline(false);
  };

  return (
    <div className="shell">
      <div className="topbar">
        {user && (
          <span className="who">
            {guest ? 'Guest' : user.email}
          </span>
        )}

        <button
          type="button"
          className="btn btn-icon"
          onClick={toggleTheme}
          aria-pressed={theme === 'dark'}
        >
          {theme === 'dark' ? '☀ Light' : '☾ Dark'}
        </button>

        {(user || offline) && cloud && (
          <button type="button" className="btn btn-icon" onClick={signOut}>
            {offline ? 'Sign in' : 'Sign out'}
          </button>
        )}
      </div>

      <header className="masthead">
        <h1>Gratitude Journal</h1>
        <p>What are you grateful for today?</p>
      </header>

      {guest && <GuestBanner />}

      {session === undefined ? (
        <p className="empty">One moment…</p>
      ) : cloud && !user && !offline ? (
        <AuthScreen onGoOffline={() => setOffline(true)} />
      ) : (
        /* Keyed so switching accounts starts from a clean slate. */
        <Journal key={user?.id ?? 'local'} userId={user?.id ?? null} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GratitudeJournal />);
</script>
</body>
</html>
