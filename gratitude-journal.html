<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gratitude Journal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
  /* ── Theme tokens ─────────────────────────────────────────────── */
  :root {
    --bg:            #FFF8F5;
    --card:          #FFFFFF;
    --text:          #2D2520;
    --text-muted:    #6B5B52;
    --border:        #F4DDD1;
    --accent:        #FF8C61;
    --accent-hover:  #FF7647;
    --accent-soft:   rgba(255, 140, 97, 0.09);
    --input-bg:      #FFFBF8;
    --shadow:        rgba(255, 140, 97, 0.08);
    --danger:        #C4442E;

    --font-body:     'DM Sans', system-ui, sans-serif;
    --font-display:  'Lora', Georgia, serif;
    --radius:        12px;
    --radius-lg:     16px;
  }

  [data-theme="dark"] {
    --bg:            #1A1614;
    --card:          #241F1C;
    --text:          #F5EDE7;
    --text-muted:    #B8A99E;
    --border:        #3D3430;
    --accent:        #FF8C61;
    --accent-hover:  #FFA47F;
    --accent-soft:   rgba(255, 140, 97, 0.13);
    --input-bg:      #2D2722;
    --shadow:        rgba(0, 0, 0, 0.32);
    --danger:        #FF8B75;
  }

  /* ── Base ─────────────────────────────────────────────────────── */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── Layout ───────────────────────────────────────────────────── */
  .shell {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-bottom: 8px;
  }

  .account {
    margin-right: auto;
    font-size: 14px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .masthead { text-align: center; margin-bottom: 44px; }

  .masthead h1 {
    margin: 0 0 8px;
    font-size: clamp(32px, 5vw, 42px);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .masthead p {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--text-muted);
  }

  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: clamp(24px, 5vw, 40px);
    box-shadow: 0 2px 16px var(--shadow);
    transition: background-color 0.3s ease;
  }

  /* ── Form ─────────────────────────────────────────────────────── */
  .field + .field { margin-top: 24px; }

  .field label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .field textarea,
  .field input {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    color: var(--text);
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    transition: border-color 0.2s ease, background-color 0.3s ease;
  }

  .field textarea {
    min-height: 80px;
    resize: vertical;
  }

  .field textarea:focus,
  .field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .field textarea::placeholder,
  .field input::placeholder { color: var(--text-muted); opacity: 0.7; }

  .hint {
    margin: 20px 0 0;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }

  kbd {
    font: inherit;
    font-size: 12px;
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--input-bg);
  }

  /* ── Buttons ──────────────────────────────────────────────────── */
  .btn {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
  }

  .btn-primary {
    display: block;
    width: 100%;
    margin-top: 28px;
    padding: 16px;
    color: #fff;
    background: var(--accent);
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-quiet {
    padding: 8px 14px;
    font-weight: 500;
    font-size: 15px;
    color: var(--accent);
    background: transparent;
    border-radius: 8px;
  }
  .btn-quiet:hover { background: var(--accent-soft); }

  .btn-icon {
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border-radius: 8px;
  }
  .btn-icon:hover { background: var(--accent-soft); color: var(--text); }

  .btn-danger { color: var(--danger); }

  /* ── Toast ────────────────────────────────────────────────────── */
  .toast {
    margin-bottom: 24px;
    padding: 16px;
    text-align: center;
    font-weight: 500;
    color: var(--accent);
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    animation: rise 0.3s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .toast-error { color: var(--danger); border-color: var(--danger); }

  /* ── Auth ─────────────────────────────────────────────────────── */
  .auth { margin-bottom: 24px; }

  .auth h2 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .auth-intro {
    margin: 0 0 24px;
    font-size: 15px;
    color: var(--text-muted);
  }

  .auth-error {
    margin: 0 0 20px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--danger);
    background: var(--accent-soft);
    border: 1px solid var(--danger);
    border-radius: 10px;
  }

  .auth-switch {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2px;
    margin-top: 20px;
  }

  /* ── Notice (local-entry migration prompt) ────────────────────── */
  .notice {
    margin-bottom: 24px;
    padding: 20px 24px;
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
  }

  .notice p { margin: 0 0 12px; font-size: 15px; }

  .notice-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }

  /* ── History ──────────────────────────────────────────────────── */
  .history-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 28px;
  }

  .history h2 {
    margin: 32px 0 20px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .entry {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 8px var(--shadow);
    transition: background-color 0.3s ease;
  }

  .entry header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .entry time {
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
  }

  .entry ol {
    margin: 0;
    padding-left: 20px;
    color: var(--text);
  }

  .entry li + li { margin-top: 10px; }

  .entry li::marker { color: var(--text-muted); font-size: 14px; }

  .confirm { display: flex; gap: 2px; align-items: center; }
  .confirm span { font-size: 13px; color: var(--text-muted); margin-right: 4px; }

  .empty {
    margin-top: 28px;
    text-align: center;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--text-muted);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>

<body>
<div id="root"></div>

<!-- ── Where your PocketBase server lives ───────────────────────────────
     Change this to your own server's URL before deploying, e.g.
       window.POCKETBASE_URL = 'https://journal.example.com';
     Leave it as-is to talk to a PocketBase started by pocketbase/start.sh.
     See README.md for hosting instructions.                              -->
<script>
  window.POCKETBASE_URL = 'http://127.0.0.1:8090';
</script>

<!-- Production React builds. Babel is here only so the JSX below runs without a
     build step — see the note at the bottom of this file for removing it. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/pocketbase@0.27.1/dist/pocketbase.umd.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ─── Storage ──────────────────────────────────────────────────────
   localStorage can throw: disabled cookies, private browsing, quota.
   Falling back to memory keeps the app usable for the session rather
   than crashing on mount.                                            */
const storage = (() => {
  let backing = null;
  try {
    const probe = '__probe__';
    window.localStorage.setItem(probe, probe);
    window.localStorage.removeItem(probe);
    backing = window.localStorage;
  } catch {
    backing = null;
  }

  const memory = new Map();

  return {
    persistent: backing !== null,
    get(key) {
      try {
        return backing ? backing.getItem(key) : memory.get(key) ?? null;
      } catch {
        return null;
      }
    },
    set(key, value) {
      try {
        if (backing) backing.setItem(key, value);
        else memory.set(key, value);
        return true;
      } catch {
        return false;
      }
    },
  };
})();

const ENTRIES_KEY = 'gratitudeEntries';
const THEME_KEY = 'gratitudeTheme';
const DECLINED_KEY = 'gratitudeUploadDeclined';
const SLOTS = 3;

/* ─── PocketBase ───────────────────────────────────────────────────
   Null when the SDK script didn't load (offline, blocked CDN). The app
   then runs exactly as it did before accounts existed: local-only.    */
const pb = window.PocketBase
  ? new window.PocketBase(window.POCKETBASE_URL || 'http://127.0.0.1:8090')
  : null;

/** Turns an SDK/network failure into something worth showing a person. */
function describeError(error) {
  if (!error) return 'Something went wrong.';
  if (error.isAbort) return '';

  /* The SDK reports unreachable hosts and CORS rejections as status 0. */
  if (error.status === 0) {
    return "Can't reach the journal server. Check that it's running and that " +
           'POCKETBASE_URL points at it.';
  }

  /* Per-field validation, e.g. { email: { message: '...' } }. */
  const fields = error.response?.data;
  if (fields && typeof fields === 'object') {
    const messages = Object.values(fields)
      .map(detail => detail?.message)
      .filter(Boolean);
    if (messages.length > 0) return messages.join(' ');
  }

  return error.response?.message || error.message || 'Something went wrong.';
}

/* ─── Helpers ──────────────────────────────────────────────────── */
const newId = () =>
  window.crypto?.randomUUID?.() ??
  `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;

/** Migrates and validates parsed JSON — from storage or an imported file.
 *  Anything malformed is dropped rather than allowed to crash the render. */
function sanitiseEntries(parsed) {
  if (!Array.isArray(parsed)) return [];

  return parsed
    .filter(e => e && typeof e === 'object' && Array.isArray(e.items))
    .map(e => ({
      id: String(e.id ?? newId()),
      date: typeof e.date === 'string' ? e.date : new Date().toISOString(),
      items: e.items.filter(i => typeof i === 'string' && i.trim() !== ''),
    }))
    .filter(e => e.items.length > 0);
}

const byNewest = (a, b) => new Date(b.date) - new Date(a.date);

function loadEntries() {
  const raw = storage.get(ENTRIES_KEY);
  if (!raw) return [];

  try {
    return sanitiseEntries(JSON.parse(raw)).sort(byNewest);
  } catch {
    return [];
  }
}

/* ─── Backends ─────────────────────────────────────────────────────
   Two interchangeable stores behind one shape. Every mutation returns the
   complete new list, so the caller never has to guess what changed — and
   each backend keeps its single write path.

     list()                  → Entry[]
     create({date, items})   → Entry[]
     addMany(entries)        → Entry[]
     remove(id)              → Entry[]

   `current` is the list on screen; the cloud backend builds on it rather
   than re-fetching after every keystroke's worth of work.               */

function localBackend() {
  const commit = list => {
    const ok = storage.set(ENTRIES_KEY, JSON.stringify(list));
    if (!ok) throw new Error("Couldn't save — browser storage is full or blocked.");
    return list;
  };

  /* Re-reading storage rather than trusting `current` keeps two tabs from
     silently clobbering each other's entries. */
  return {
    kind: 'local',
    async list() {
      return loadEntries();
    },
    async create({ date, items }) {
      return commit([{ id: newId(), date, items }, ...loadEntries()]);
    },
    async addMany(entries) {
      return commit([...loadEntries(), ...entries].sort(byNewest));
    },
    async remove(id) {
      return commit(loadEntries().filter(e => e.id !== id));
    },
  };
}

/** PocketBase record → the shape the UI already understands. */
function fromRecord(record) {
  return {
    id: record.id,
    /* PocketBase returns "2026-08-08 09:30:00.000Z". Safari won't parse the
       space-separated form, so normalise it to ISO-8601 here — the one place
       records enter the app. */
    date: typeof record.date === 'string' && record.date
      ? record.date.replace(' ', 'T')
      : new Date().toISOString(),
    items: Array.isArray(record.items)
      ? record.items.filter(i => typeof i === 'string' && i.trim() !== '')
      : [],
  };
}

function cloudBackend(userId) {
  const entries = () => pb.collection('entries');

  return {
    kind: 'cloud',
    async list() {
      const records = await entries().getFullList({ sort: '-date', batch: 200 });
      return records.map(fromRecord);
    },
    async create({ date, items }, current = []) {
      const record = await entries().create({ user: userId, date, items });
      return [fromRecord(record), ...current].sort(byNewest);
    },
    async addMany(list, current = []) {
      const created = [];
      /* Sequential: a half-finished parallel upload is much harder to
         reason about, and these batches are small. */
      for (const entry of list) {
        const record = await entries().create({
          user: userId,
          date: entry.date,
          items: entry.items,
        });
        created.push(fromRecord(record));
      }
      return [...current, ...created].sort(byNewest);
    },
    async remove(id, current = []) {
      await entries().delete(id);
      return current.filter(e => e.id !== id);
    },
  };
}

const dateFormatter = new Intl.DateTimeFormat('en-GB', {
  day: 'numeric', month: 'short', year: 'numeric',
});
const sameDayFormatter = new Intl.DateTimeFormat('en-GB', {
  day: 'numeric', month: 'short',
});

function formatDate(isoString) {
  const date = new Date(isoString);
  if (Number.isNaN(date.getTime())) return 'Unknown date';

  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);

  if (date.toDateString() === today.toDateString()) return 'Today';
  if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';

  return date.getFullYear() === today.getFullYear()
    ? sameDayFormatter.format(date)
    : dateFormatter.format(date);
}

/* ─── Theme ────────────────────────────────────────────────────── */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    const stored = storage.get(THEME_KEY);
    if (stored === 'light' || stored === 'dark') return stored;
    return window.matchMedia?.('(prefers-color-scheme: dark)').matches
      ? 'dark'
      : 'light';
  });

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    storage.set(THEME_KEY, theme);
  }, [theme]);

  const toggle = useCallback(
    () => setTheme(t => (t === 'dark' ? 'light' : 'dark')),
    []
  );

  return [theme, toggle];
}

/* ─── Auth ─────────────────────────────────────────────────────── */
function useAuth() {
  const [user, setUser] = useState(() => pb?.authStore.record ?? null);

  useEffect(() => {
    if (!pb) return undefined;
    /* onChange returns its own unsubscribe function. */
    return pb.authStore.onChange((token, record) => setUser(record ?? null));
  }, []);

  /* A stored token may have expired while the tab was closed. Refresh it once
     on mount so we don't show a signed-in UI that fails on the first write.
     Network trouble must not sign anyone out — only a refusal does. */
  useEffect(() => {
    if (!pb?.authStore.isValid) return;
    pb.collection('users').authRefresh().catch(error => {
      if (error?.status === 401 || error?.status === 403) pb.authStore.clear();
    });
  }, []);

  return user;
}

const AUTH_COPY = {
  signin:   { heading: 'Welcome back',      action: 'Sign in',        busy: 'Signing in…' },
  register: { heading: 'Create an account', action: 'Create account', busy: 'Creating…' },
  reset:    { heading: 'Reset your password', action: 'Send reset link', busy: 'Sending…' },
};

function AuthPanel({ onSignedIn, onCancel }) {
  const [mode, setMode] = useState('signin');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [notice, setNotice] = useState('');

  const emailField = useRef(null);
  useEffect(() => { emailField.current?.focus(); }, []);

  const switchTo = next => {
    setMode(next);
    setError('');
    setNotice('');
    setPassword('');
  };

  const submit = async event => {
    event.preventDefault();
    if (busy) return;

    setBusy(true);
    setError('');
    setNotice('');

    try {
      const users = pb.collection('users');

      if (mode === 'reset') {
        await users.requestPasswordReset(email.trim());
        /* Deliberately not confirming whether the address exists. */
        setNotice('If that address has an account, a reset link is on its way.');
        return;
      }

      if (mode === 'register') {
        await users.create({
          email: email.trim(),
          password,
          passwordConfirm: password,
        });
      }

      await users.authWithPassword(email.trim(), password);
      setPassword('');
      onSignedIn();
    } catch (err) {
      setError(describeError(err));
    } finally {
      setBusy(false);
    }
  };

  const copy = AUTH_COPY[mode];

  return (
    <section className="card auth" aria-label={copy.heading}>
      <h2>{copy.heading}</h2>
      <p className="auth-intro">
        {mode === 'reset'
          ? "We'll email you a link to choose a new password."
          : 'Your entries sync to your account, so they follow you between devices.'}
      </p>

      <div role="alert">
        {error && <p className="auth-error">{error}</p>}
      </div>
      <div role="status" aria-live="polite">
        {notice && <p className="hint">{notice}</p>}
      </div>

      <form onSubmit={submit}>
        <div className="field">
          <label htmlFor="auth-email">Email</label>
          <input
            id="auth-email"
            ref={emailField}
            type="email"
            value={email}
            onChange={e => setEmail(e.target.value)}
            autoComplete="email"
            required
          />
        </div>

        {mode !== 'reset' && (
          <div className="field">
            <label htmlFor="auth-password">Password</label>
            <input
              id="auth-password"
              type="password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              autoComplete={mode === 'register' ? 'new-password' : 'current-password'}
              minLength={8}
              required
            />
            {mode === 'register' && (
              <p className="hint" style={{ textAlign: 'left', marginTop: '8px' }}>
                At least 8 characters.
              </p>
            )}
          </div>
        )}

        <button type="submit" className="btn btn-primary" disabled={busy}>
          {busy ? copy.busy : copy.action}
        </button>
      </form>

      <div className="auth-switch">
        {mode === 'signin' && (
          <>
            <button type="button" className="btn btn-quiet" onClick={() => switchTo('register')}>
              Create an account
            </button>
            <button type="button" className="btn btn-icon" onClick={() => switchTo('reset')}>
              Forgot password?
            </button>
          </>
        )}

        {mode !== 'signin' && (
          <button type="button" className="btn btn-quiet" onClick={() => switchTo('signin')}>
            Back to sign in
          </button>
        )}

        <button type="button" className="btn btn-icon" onClick={onCancel}>
          Continue without an account
        </button>
      </div>
    </section>
  );
}

/* ─── Entry card ───────────────────────────────────────────────── */
function EntryCard({ entry, onDelete }) {
  const [confirming, setConfirming] = useState(false);
  const label = formatDate(entry.date);

  return (
    <article className="entry">
      <header>
        <time dateTime={entry.date}>{label}</time>

        {confirming ? (
          <div className="confirm">
            <span>Delete this entry?</span>
            <button
              type="button"
              className="btn btn-icon btn-danger"
              onClick={() => onDelete(entry.id)}
            >
              Delete
            </button>
            <button
              type="button"
              className="btn btn-icon"
              onClick={() => setConfirming(false)}
            >
              Keep
            </button>
          </div>
        ) : (
          <button
            type="button"
            className="btn btn-icon"
            onClick={() => setConfirming(true)}
          >
            Delete<span className="sr-only"> entry from {label}</span>
          </button>
        )}
      </header>

      <ol>
        {entry.items.map((item, i) => (
          <li key={i}>{item}</li>
        ))}
      </ol>
    </article>
  );
}

/* ─── App ──────────────────────────────────────────────────────── */
function GratitudeJournal() {
  const [theme, toggleTheme] = useTheme();
  const user = useAuth();

  const [drafts, setDrafts] = useState(() => Array(SLOTS).fill(''));
  /* Signed-in sessions fetch from the server, so start empty and let the
     loader fill in; guests can render their entries immediately. */
  const [entries, setEntries] = useState(() =>
    pb?.authStore.isValid ? [] : loadEntries()
  );
  const [loading, setLoading] = useState(() => Boolean(pb?.authStore.isValid));
  const [loadError, setLoadError] = useState('');
  const [showHistory, setShowHistory] = useState(false);
  const [showAuth, setShowAuth] = useState(false);
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState('');
  const [toastTone, setToastTone] = useState('info');
  const [pendingUpload, setPendingUpload] = useState(null);
  /* Bumped to re-run the loader after a failed fetch. */
  const [reloadToken, setReloadToken] = useState(0);

  const toastTimer = useRef(null);
  const firstField = useRef(null);
  const fileInput = useRef(null);

  /* Entries live either in this browser or in the signed-in user's account —
     never both, so signing out can't leave someone else's entries on the
     device. Swapping the backend is the only thing that decides which. */
  const backend = useMemo(
    () => (user && pb ? cloudBackend(user.id) : localBackend()),
    [user?.id]
  );

  useEffect(() => () => clearTimeout(toastTimer.current), []);

  const flash = useCallback((message, tone = 'info') => {
    setToast(message);
    setToastTone(tone);
    clearTimeout(toastTimer.current);
    /* Errors are worth more reading time than "Entry saved.". */
    toastTimer.current = setTimeout(
      () => setToast(''),
      tone === 'error' ? 6000 : 2500
    );
  }, []);

  /* Load whenever the backend changes: on mount, on sign-in, on sign-out. */
  useEffect(() => {
    let cancelled = false;

    setLoadError('');
    setShowHistory(false);
    setLoading(true);

    backend
      .list()
      .then(list => {
        if (cancelled) return;
        setEntries(list);

        /* Just signed in with entries still on this device? Offer to move
           them across rather than silently stranding them. */
        if (backend.kind === 'cloud') {
          const declined = storage.get(DECLINED_KEY) === user?.id;
          const local = loadEntries();
          if (local.length > 0 && !declined) setPendingUpload(local);
        } else {
          setPendingUpload(null);
        }
      })
      .catch(error => {
        if (cancelled) return;
        setEntries([]);
        setLoadError(describeError(error));
      })
      .finally(() => {
        if (!cancelled) setLoading(false);
      });

    return () => { cancelled = true; };
  }, [backend, reloadToken]);

  const filled = useMemo(
    () => drafts.map(d => d.trim()).filter(Boolean),
    [drafts]
  );

  const updateDraft = (index, value) =>
    setDrafts(prev => prev.map((d, i) => (i === index ? value : d)));

  /* Every mutation funnels through here so the backend call, the busy flag and
     the error path are written once instead of per action. */
  const mutate = useCallback(
    async (operation, onSuccess) => {
      if (busy) return;
      setBusy(true);
      try {
        const next = await operation();
        setEntries(next);
        onSuccess?.(next);
      } catch (error) {
        flash(describeError(error), 'error');
      } finally {
        setBusy(false);
      }
    },
    [busy, flash]
  );

  const save = () => {
    if (filled.length === 0) return;

    const draft = { date: new Date().toISOString(), items: filled };
    mutate(
      () => backend.create(draft, entries),
      () => {
        setDrafts(Array(SLOTS).fill(''));
        flash(backend.kind === 'cloud' ? 'Entry saved to your account.' : 'Entry saved.');
        firstField.current?.focus();
      }
    );
  };

  const deleteEntry = id => mutate(() => backend.remove(id, entries));

  /* Moves this device's entries into the account, then clears the local copy
     so the two can't drift apart. Only on a clean upload. */
  const uploadLocal = () => {
    const count = pendingUpload.length;
    mutate(
      () => backend.addMany(pendingUpload, entries),
      () => {
        storage.set(ENTRIES_KEY, '[]');
        setPendingUpload(null);
        flash(`Moved ${count} ${count === 1 ? 'entry' : 'entries'} to your account.`);
      }
    );
  };

  const keepLocal = () => {
    if (user?.id) storage.set(DECLINED_KEY, user.id);
    setPendingUpload(null);
  };

  const signOut = () => {
    pb?.authStore.clear();
    setShowAuth(false);
    flash('Signed out.');
  };

  /* Ctrl/Cmd+Enter from any textarea saves. */
  const onKeyDown = event => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
      event.preventDefault();
      save();
    }
  };

  const exportEntries = () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], {
      type: 'application/json',
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `gratitude-journal-${new Date()
      .toISOString()
      .slice(0, 10)}.json`;
    link.click();
    URL.revokeObjectURL(url);
  };

  /* Adds entries from an exported file, skipping ones already here. Matching on
     content as well as id, because the server assigns its own ids — a re-import
     of the same file would otherwise duplicate everything. */
  const importEntries = async event => {
    const file = event.target.files?.[0];
    event.target.value = ''; // so the same file can be picked again
    if (!file) return;

    let imported;
    try {
      imported = sanitiseEntries(JSON.parse(await file.text()));
    } catch {
      flash("Couldn't read that file — is it a journal export?", 'error');
      return;
    }

    const signature = e => `${e.date}\u0000${e.items.join('\u0000')}`;
    const seenIds = new Set(entries.map(e => e.id));
    const seenContent = new Set(entries.map(signature));
    const fresh = imported.filter(
      e => !seenIds.has(e.id) && !seenContent.has(signature(e))
    );

    if (fresh.length === 0) {
      flash(
        imported.length === 0
          ? 'No entries found in that file.'
          : 'Those entries are already in your journal.'
      );
      return;
    }

    mutate(
      () => backend.addMany(fresh, entries),
      () => flash(`Imported ${fresh.length} ${fresh.length === 1 ? 'entry' : 'entries'}.`)
    );
  };

  return (
    <div className="shell">
      <div className="topbar">
        {user && <span className="account">Signed in as {user.email}</span>}

        {pb && (
          user ? (
            <button type="button" className="btn btn-icon" onClick={signOut}>
              Sign out
            </button>
          ) : (
            <button
              type="button"
              className="btn btn-quiet"
              onClick={() => setShowAuth(v => !v)}
              aria-expanded={showAuth}
            >
              {showAuth ? 'Close' : 'Sign in'}
            </button>
          )
        )}

        <button
          type="button"
          className="btn btn-icon"
          onClick={toggleTheme}
          aria-pressed={theme === 'dark'}
        >
          {theme === 'dark' ? '☀ Light' : '☾ Dark'}
        </button>
      </div>

      <header className="masthead">
        <h1>Gratitude Journal</h1>
        <p>What are you grateful for today?</p>
      </header>

      {/* Announced to screen readers without stealing focus. */}
      <div role="status" aria-live="polite">
        {toast && (
          <div className={toastTone === 'error' ? 'toast toast-error' : 'toast'}>
            {toast}
          </div>
        )}
      </div>

      {showAuth && !user && (
        <AuthPanel
          onSignedIn={() => setShowAuth(false)}
          onCancel={() => setShowAuth(false)}
        />
      )}

      {loadError && (
        <div className="notice" role="alert">
          <p>{loadError}</p>
          <div className="notice-actions">
            <button
              type="button"
              className="btn btn-quiet"
              onClick={() => setReloadToken(n => n + 1)}
              disabled={loading}
            >
              {loading ? 'Retrying…' : 'Try again'}
            </button>
          </div>
        </div>
      )}

      {pendingUpload && (
        <div className="notice">
          <p>
            {pendingUpload.length === 1
              ? 'There is 1 entry saved on this device. Move it into your account so it follows you between devices?'
              : `There are ${pendingUpload.length} entries saved on this device. Move them into your account so they follow you between devices?`}
          </p>
          <div className="notice-actions">
            <button
              type="button"
              className="btn btn-quiet"
              onClick={uploadLocal}
              disabled={busy}
            >
              {busy ? 'Moving…' : 'Move to my account'}
            </button>
            <button type="button" className="btn btn-icon" onClick={keepLocal}>
              Keep on this device
            </button>
          </div>
        </div>
      )}

      <section className="card" aria-label="New entry">
        {drafts.map((value, index) => (
          <div className="field" key={index}>
            <label htmlFor={`gratitude-${index}`}>{index + 1}.</label>
            <textarea
              id={`gratitude-${index}`}
              ref={index === 0 ? firstField : null}
              value={value}
              onChange={e => updateDraft(index, e.target.value)}
              onKeyDown={onKeyDown}
              placeholder="I'm grateful for..."
            />
          </div>
        ))}

        <button
          type="button"
          className="btn btn-primary"
          onClick={save}
          disabled={filled.length === 0 || busy}
        >
          {busy ? 'Saving…' : 'Save entry'}
        </button>

        <p className="hint">
          <kbd>Ctrl</kbd> + <kbd>Enter</kbd> saves
        </p>
      </section>

      {loading && <p className="empty">Loading your entries…</p>}

      {!loading && !loadError && entries.length === 0 && (
        <p className="empty">Your first entry will appear here.</p>
      )}

      <div className="history-bar">
        {entries.length > 0 && (
          <>
            <button
              type="button"
              className="btn btn-quiet"
              onClick={() => setShowHistory(v => !v)}
              aria-expanded={showHistory}
              aria-controls="history"
            >
              {showHistory ? 'Hide past entries' : 'View past entries'} (
              {entries.length})
            </button>
            <button type="button" className="btn btn-icon" onClick={exportEntries}>
              Export
            </button>
          </>
        )}

        <button
          type="button"
          className="btn btn-icon"
          onClick={() => fileInput.current?.click()}
        >
          Import
        </button>
        <input
          type="file"
          accept="application/json,.json"
          ref={fileInput}
          onChange={importEntries}
          className="sr-only"
          aria-label="Import entries from a JSON file"
        />
      </div>

      {entries.length > 0 && showHistory && (
        <section className="history" id="history">
          <h2>Past entries</h2>
          {entries.map(entry => (
            <EntryCard key={entry.id} entry={entry} onDelete={deleteEntry} />
          ))}
        </section>
      )}

      {!pb && (
        <p className="empty">
          Accounts are unavailable — the PocketBase library couldn't load, so
          entries stay on this device.
        </p>
      )}

      {pb && !user && !showAuth && (
        <p className="empty">
          These entries are saved on this device only.{' '}
          <button
            type="button"
            className="btn btn-quiet"
            onClick={() => setShowAuth(true)}
          >
            Sign in to sync them
          </button>
        </p>
      )}

      {!storage.persistent && !user && (
        <p className="empty">
          Browser storage is unavailable, so entries will only last until you
          close this tab.
        </p>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GratitudeJournal />);
</script>
</body>
</html>
