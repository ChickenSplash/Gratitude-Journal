<VirtualHost *:3000>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    # Straight to the container's stdout/stderr, so `docker compose logs` is
    # the only place worth looking.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        Require all granted

        # The rules Laravel normally ships in public/.htaccess, moved into the
        # vhost. AllowOverride None means Apache stops looking for .htaccess
        # files on every request.
        AllowOverride None

        RewriteEngine On

        # PHP-CGI drops the Authorization header unless it is handed over.
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Trailing slashes, on anything that isn't a real directory.
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]

        # Everything else is the front controller's problem.
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Nothing under here is ever a URL — the app's own files live outside
    # public/ entirely, but belt and braces.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
