; The image is immutable, so the opcode cache never needs to stat a file to
; find out whether it changed — a rebuild is the only way code can differ.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

expose_php = Off
memory_limit = 256M

; Import files are a few kilobytes of JSON; the route that accepts them caps
; the upload at 5 MB of its own accord.
upload_max_filesize = 8M
post_max_size = 8M
